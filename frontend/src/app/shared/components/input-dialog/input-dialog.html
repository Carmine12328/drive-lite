<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>{{ data.label }}</mat-label>
    <input matInput [formControl]="inputControl" [placeholder]="data.placeholder || ''" (keyup.enter)="onConfirm()" cdkFocusInitial>
    @if (inputControl.hasError('required')) {
      <mat-error>This field is required</mat-error>
    }
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button color="primary" [disabled]="inputControl.invalid" (click)="onConfirm()">
    {{ data.confirmText || 'Confirm' }}
  </button>
</mat-dialog-actions>
