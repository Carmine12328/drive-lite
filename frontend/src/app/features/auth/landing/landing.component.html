<div class="landing-container">
  <!-- Top Right Actions -->
  <div class="top-actions">
    <button mat-icon-button (click)="toggleTheme()" aria-label="Toggle theme">
      <mat-icon>{{ isDarkTheme() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
  </div>

  <div class="content-wrapper">
    <!-- Hero Section -->
    <header class="hero-section">
      <div class="logo-container">
        <mat-icon class="animated-cloud">cloud</mat-icon>
      </div>
      <h1 class="gradient-text title">Drive Lite</h1>
      <p class="tagline">Secure cloud storage & asset management, built with Angular 22 & AWS</p>
    </header>

    <!-- CTAs -->
    <div class="cta-container">
      <div class="glass-panel cta-card" (click)="navigateToRegister()" tabindex="0" role="button" (keydown.enter)="navigateToRegister()">
        <div class="card-icon custom-icon">
          <mat-icon>person_add</mat-icon>
        </div>
        <h2>Create Account</h2>
        <p>Sign up to start managing your files and folders securely</p>
      </div>

      <div class="glass-panel cta-card" (click)="navigateToLogin()" tabindex="0" role="button" (keydown.enter)="navigateToLogin()">
        <div class="card-icon custom-icon">
          <mat-icon>login</mat-icon>
        </div>
        <h2>Sign In</h2>
        <p>Access your existing drive, files, and workspace</p>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>Drive Lite &copy; 2026 — Secure Cloud Asset Manager</p>
    </footer>
  </div>
</div>
