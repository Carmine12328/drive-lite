<!-- Sidebar toggle button (mobile only) -->
<button mat-icon-button
        class="sidebar-toggle"
        (click)="toggleSidebar()"
        aria-label="Toggle sidebar">
  <mat-icon>{{ sidebarOpen() ? 'menu_open' : 'menu' }}</mat-icon>
</button>

<div class="browser-layout">
  <!-- Sidebar -->
  <aside class="sidebar" [class.sidebar-open]="sidebarOpen()" [style.width.px]="sidebarWidth()">
    <app-folder-tree
      #folderTree
      [folders]="allFolders()"
      [activeFolderId]="currentFolderId()"
      (folderSelect)="onFolderSelect($event)"
      (folderContextMenu)="onFolderContextMenu($event)"
    />
  </aside>

  <!-- Backdrop overlay (mobile only) — closes sidebar when tapped -->
  @if (sidebarOpen()) {
    <div class="sidebar-backdrop" (click)="toggleSidebar()" (keydown.escape)="toggleSidebar()" role="button" tabindex="0" aria-label="Close sidebar"></div>
  }


  <!-- Resize handle -->
  <div class="resize-handle"
       (pointerdown)="onResizeStart($event)"
       role="separator"
       aria-label="Resize sidebar"
       tabindex="0">
  </div>

  <!-- Main content area -->
  <section class="main-content"
           (contextmenu)="onBackgroundContextMenu($event)"
           (dragenter)="onDragEnter($event)"
           (dragleave)="onDragLeave($event)"
           (dragover)="onDragOver($event)"
           (drop)="onDrop($event)">

    <!-- Breadcrumb + actions toolbar -->
    <div class="toolbar">
      <app-breadcrumb
        [path]="breadcrumbPath()"
        (navigate)="onBreadcrumbNavigate($event)"
      />
      <div class="toolbar-actions">
        <button mat-flat-button color="primary" (click)="onUploadRequest()">
          <mat-icon>upload</mat-icon>
          Upload
        </button>
        <button mat-icon-button (click)="onNewFolder()" aria-label="Create new folder">
          <mat-icon>create_new_folder</mat-icon>
        </button>
      </div>
    </div>

    <!-- Loading indicator -->
    @if (isLoading()) {
      <div class="loading-bar">
        <div class="loading-bar-fill"></div>
      </div>
    }

    <!-- File list -->
    <app-file-list
      [files]="files()"
      [folders]="subFolders()"
      [isLoading]="isLoading()"
      [viewMode]="viewMode()"
      [sortField]="sortField()"
      [sortDirection]="sortDirection()"
      (fileAction)="onFileAction($event)"
      (sortChange)="onSortChange($event)"
      (fileContextMenu)="onFileContextMenu($event)"
      (folderContextMenu)="onFolderContextMenu($event)"
      (uploadRequest)="onUploadRequest()"
      (folderClick)="onFolderSelect($event)"
      (folderAction)="onFolderAction($event)"
    />

    <!-- Drag-and-drop overlay -->
    @if (showDropOverlay()) {
      <div class="drop-overlay">
        <div class="drop-overlay-content">
          <mat-icon class="drop-icon">cloud_upload</mat-icon>
          <p>Drop files to upload</p>
        </div>
      </div>
    }
  </section>
</div>

<!-- Context menu (shared instance for files and folders) -->
<app-context-menu
  (menuAction)="onContextMenuAction($event)"
  #contextMenu
/>

<!-- Floating selection toolbar for batch operations -->
<app-selection-toolbar />
